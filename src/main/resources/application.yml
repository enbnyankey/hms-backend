spring:
  application:
    name: hms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  # Local secrets (DB password, JWT secret) live in .env.local, which is
  # gitignored. Format: one KEY=value per line, e.g. DB_PASSWORD=yourpassword
  config:
    import: optional:file:.env.local[.properties]

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100,http://localhost:3000}

logging:
  level:
    com.aurahealth.hms: INFO

---
# PostgreSQL profile (default). Flyway owns the schema: it runs
# db/migration/V*.sql on startup, so Hibernate only reads tables.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
