spring:
  application:
    name: hms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100,http://localhost:3000}

logging:
  level:
    com.aurahealth.hms: INFO

---
# Local/dev profile: in-memory H2 so the backend runs with zero setup while
# the Patient Registry slice is being built out. Switch to `postgres` once a
# real PostgreSQL instance is available (docker or a local install).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:hms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

---
# PostgreSQL profile — the intended production/target database.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurahealth_hms}
    username: ${DB_USERNAME:aurahealth}
    password: ${DB_PASSWORD:aurahealth}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
